[project]
name = "abstracted"
version = "0.1.0"
description = "Two-layer agentic document processing for research papers"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "pillow>=10.0",
    "datasets>=3.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "dvc[s3]>=3.50",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/__main__.py" = ["B008"]  # typer.Option/Argument in defaults is canonical

[tool.pyright]
pythonVersion = "3.11"
include = ["packages"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
